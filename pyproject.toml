[project]
name = "on-the-wall"
version = "0.1.0"
description = "Mirror Mirror - An art installation that transforms live camera feeds"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate>=1.12.0",
    "aiohttp>=3.13.2",
    "aiortc>=1.14.0",
    "basicsr>=1.4.2",
    "betterproto2>=0.9.1",
    "betterproto2-compiler>=0.9.0",
    "bitsandbytes>=0.49.0",
    "diffusers>=0.36.0",
    "grpcio-tools>=1.62.3",
    "huggingface-hub>=0.36.0",
    "librosa>=0.11.0",
    "opencv-python>=4.12.0.88",
    "pydantic-settings>=2.12.0",
    "pypeln>=0.4.9",
    "pywebview[qt]>=6.1",
    "pyzmq>=27.1.0",
    "realesrgan>=0.3.0",
    "rich>=14.2.0",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "sqlmodel>=0.0.29",
    "textual>=7.3.0",
    "timm>=1.0.24",
    "torch>=2.5.0",
    "torchvision",
    "transformers>=4.57.3",
    "typer>=0.20.1",
    "nvidia-cublas-cu12>=12.6.4.1 ; sys_platform == 'linux'",
    "nvidia-cuda-cupti-cu12>=12.6.80 ; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu12>=12.6.77 ; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12>=12.6.77 ; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.5.1.17 ; sys_platform == 'linux'",
    "nvidia-cufft-cu12>=11.3.0.4 ; sys_platform == 'linux'",
    "nvidia-cufile-cu12>=1.11.1.6 ; sys_platform == 'linux'",
    "nvidia-curand-cu12>=10.3.7.77 ; sys_platform == 'linux'",
    "nvidia-cusolver-cu12>=11.7.1.2 ; sys_platform == 'linux'",
    "nvidia-cusparse-cu12>=12.5.4.2 ; sys_platform == 'linux'",
    "nvidia-cusparselt-cu12>=0.6.3 ; sys_platform == 'linux'",
    "nvidia-nccl-cu12>=2.26.2 ; sys_platform == 'linux'",
    "nvidia-nvjitlink-cu12>=12.6.85 ; sys_platform == 'linux'",
    "nvidia-nvtx-cu12>=12.6.77 ; sys_platform == 'linux'",
]

[project.scripts]
camera = "mirror.native_camera:app"
pipeline = "mirror.pipeline:app"

[tool.uv]
package = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { marker = "sys_platform == 'linux'", path = "./wheels/torch-2.5.0a0+872d972e41.nv24.08-cp310-cp310-linux_aarch64.whl" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
#    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "watchfiles>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirror"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

tool.uv.required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin'"
]
