[project]
name = "on-the-wall"
version = "0.1.0"
description = "Mirror Mirror - An art installation that transforms live camera feeds"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.12.0",
    "aiohttp>=3.13.2",
    "aiortc>=1.14.0",
    "basicsr>=1.4.2",
    "betterproto2>=0.9.1",
    "betterproto2-compiler>=0.9.0",
    "bitsandbytes>=0.49.0",
    "dearpygui>=2.1.1",
    "diffusers>=0.36.0",
    "grpcio-tools>=1.62.3",
    "huggingface-hub>=0.36.0",
    "librosa>=0.11.0",
    "opencv-python>=4.12.0.88",
    "pydantic-settings>=2.12.0",
    "pypeln>=0.4.9",
    "pywebview[qt]>=6.1",
    "pyzmq>=27.1.0",
    "realesrgan>=0.3.0",
    "rich>=14.2.0",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "sqlmodel>=0.0.29",
    "textual>=7.3.0",
    "timm>=1.0.24",
    "torch>=2.9.1",
    "torchao>=0.15.0",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
    "typer>=0.20.1",
    "xformers>=0.0.33.post2 ; sys_platform == 'linux'",
]

[project.scripts]
camera = "mirror.native_camera:app"
pipeline = "mirror.pipeline:app"

[tool.uv]
package = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "watchfiles>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirror"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

